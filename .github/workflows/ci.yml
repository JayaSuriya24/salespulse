name: SalesPulse CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches the Dockerfile/Render; 3.13 is the locally verified version.
        # (pandas 2.2.3 does not support 3.14, so it is intentionally not listed.)
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pip check
      # -ra prints the reason for every skipped test. The data-dependent tests skip in CI because
      # data/processed and artifacts are gitignored; all other tests (incl. auth) run.
      - run: python -m pytest -ra
